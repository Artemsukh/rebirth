<div class="space" id="space" aria-hidden="true"></div>
<a class="skip" href="#readCol" data-t="skip"></a>

<div class="lang-bar">
  <div class="lang-sw" role="radiogroup" aria-labelledby="langL">
    <svg class="globe" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7.5"/><ellipse cx="10" cy="10" rx="3.2" ry="7.5"/><path d="M2.5 10h15M4 6h12M4 14h12"/></svg>
    <span class="sr-only" id="langL" data-t="langLabel"></span>
    <div class="lang-track" id="langTrack">
      <span class="lang-thumb" aria-hidden="true"></span>
      <label><input type="radio" name="lang" value="en"><span lang="en">English</span></label>
      <label><input type="radio" name="lang" value="ja"><span lang="ja">日本語</span></label>
      <label><input type="radio" name="lang" value="es"><span lang="es">Español</span></label>
      <label><input type="radio" name="lang" value="ko"><span lang="ko">한국어</span></label>
    </div>
  </div>
</div>

<header class="hud-head">
  <div class="brand">
    <svg class="logo" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="11"/><ellipse cx="20" cy="20" rx="18" ry="5.4" transform="rotate(-16 20 20)"/><circle class="logo-dot" cx="20" cy="20" r="2.4"/></svg>
    <h1 class="brand-name">Rebirth Simulator</h1>
  </div>
  <p class="head-mid" id="lede"></p>
  <p class="head-live" id="live"></p>
</header>

<main>
  <section class="stage" id="stage" data-tier="NONE" aria-labelledby="idName">
    <div class="center-col">
      <div class="planet-wrap">
        <div id="planet" aria-hidden="true"></div>
      </div>
      <div class="actions" id="actions">
        <button type="button" class="btn btn-primary" id="draw1" data-t="draw1"></button>
        <button type="button" class="btn btn-ghost" id="draw10"><span class="lg" data-t="draw10"></span><span class="sm" aria-hidden="true">×10</span></button>
        <button type="button" class="btn btn-ghost" id="draw100"><span class="lg" data-t="draw100"></span><span class="sm" aria-hidden="true">×100</span></button>
      </div>
      <p class="batch-line" id="batchLine" hidden></p>
    </div>

    <div class="id-col" id="idCol">
      <div class="id-head">
        <span class="chip" id="chip"></span>
        <div class="id-kind"><span class="kind-l" id="kindL"></span><span class="kind-no" id="kindNo"></span></div>
        <h2 class="id-name" id="idName"></h2>
        <span class="id-sex" id="idSex"></span>
        <div class="id-sub"><p class="id-en" id="idEn"></p><p class="id-geo" id="idGeo"></p></div>
        <button type="button" class="btn btn-mini" id="copyBtn" data-t="copy" hidden></button>
      </div>
      <dl class="facts" id="facts"></dl>
    </div>

    <div class="read-col" id="readCol" tabindex="-1">
      <section class="panel p-prob" aria-labelledby="lbProb">
        <h3 class="p-label" id="lbProb" data-t="lbProb"></h3>
        <p class="p-val big" id="vProb"></p>
        <p class="p-sub" id="sProb"></p>
      </section>
      <section class="panel p-gdp" aria-labelledby="lbGdp">
        <h3 class="p-label" id="lbGdp"><span data-t="lbGdp"></span> <small id="nGdp"></small></h3>
        <p class="p-val big" id="vGdp"></p>
        <p class="p-sub" id="sGdp"></p>
        <div class="rank" id="rGdp">
          <span class="bar" aria-hidden="true"><b></b><i></i></span>
          <span class="rank-l" id="wGdp"></span><span class="rank-r" id="kGdp"></span>
        </div>
      </section>
      <section class="panel p-tier" aria-labelledby="lbTier">
        <h3 class="p-label" id="lbTier" data-t="lbTier"></h3>
        <div class="tier-row">
          <span class="pips" id="pips" aria-hidden="true"><i></i><i></i><i></i></span>
          <p class="tier-name" id="vTier"></p>
        </div>
        <p class="tier-desc" id="dTier"></p>
        <div class="tier-bar" id="tierBar" aria-hidden="true"></div>
        <p class="tier-bar-l" id="tierBarL"></p>
        <p class="tier-say" id="sTier"></p>
      </section>
      <section class="panel p-life" aria-labelledby="lbLife">
        <h3 class="p-label" id="lbLife" data-t="lbLife"></h3>
        <p class="p-val mid" id="vLife"></p>
        <div class="rank thin" id="rLife">
          <span class="bar" aria-hidden="true"><b></b><i></i></span>
          <span class="rank-l" id="wLife"></span><span class="rank-r" id="kLife"></span>
        </div>
        <p class="p-foot" id="fLife"></p>
      </section>
    </div>
  </section>

  <section class="block atlas" id="atlas" aria-labelledby="atlasTitle">
    <div class="block-h">
      <span class="idx" aria-hidden="true">01</span>
      <h2 id="atlasTitle" data-t="atlasTitle"></h2>
    </div>
    <p class="sub" id="atlasLede"></p>
    <div class="atlas-top">
      <ul class="keys" id="keys"></ul>
      <button type="button" class="btn btn-mini" id="resetMap" data-t="resetMap" hidden></button>
    </div>
    <div class="map-wrap" id="mapWrap">
      <svg id="map" viewBox="0 0 1000 486" role="img"></svg>
      <div class="tip" id="tip" hidden></div>
      <p class="map-msg" id="mapMsg" hidden></p>
    </div>
    <p class="note" id="legend"></p>
    <div class="batch" id="batch" hidden></div>
  </section>

  <section class="block" id="hundred" aria-labelledby="hTitle">
    <div class="block-h">
      <span class="idx" aria-hidden="true">02</span>
      <h2 id="hTitle" data-t="hTitle"></h2>
    </div>
    <p class="sub" id="hLede"></p>
    <div class="h-tier">
      <h3 class="minor" data-t="hByTier"></h3>
      <div class="tier-strip" id="hTier" role="img"></div>
      <ul class="tier-keys" id="hTierKeys"></ul>
    </div>
    <div class="h-grid">
      <div>
        <h3 class="minor" data-t="hByCont"></h3>
        <div class="waffle" id="waffle" role="img"></div>
        <ul class="legend" id="hLegend"></ul>
      </div>
      <div>
        <h3 class="minor" data-t="hByCountry"></h3>
        <ol class="bars" id="hBars"></ol>
      </div>
    </div>
  </section>

  <section class="block" id="mine" aria-labelledby="mTitle">
    <div class="block-h">
      <span class="idx" aria-hidden="true">03</span>
      <h2 id="mTitle" data-t="mTitle"></h2>
    </div>
    <p class="sub" id="mLede"></p>
    <div class="m-grid">
      <div id="mCmpWrap">
        <h3 class="minor" data-t="mByCont"></h3>
        <ul class="cmp" id="mCmp"></ul>
        <h3 class="minor gap" data-t="mByTier"></h3>
        <ul class="cmp tiers" id="mTier"></ul>
        <p class="note" data-t="mNote"></p>
        <p class="mtop" id="mTop"></p>
      </div>
      <div>
        <h3 class="minor" data-t="mRecent"></h3>
        <ol class="recent" id="mRecent"></ol>
        <button type="button" class="btn btn-mini" id="clearBtn" data-t="clear"></button>
      </div>
    </div>
  </section>

  <section class="block" id="all" aria-labelledby="tTitle">
    <div class="block-h">
      <span class="idx" aria-hidden="true">04</span>
      <h2 id="tTitle"></h2>
    </div>
    <p class="sub" data-t="tSub"></p>
    <div class="tbl-tools">
      <label class="sr-only" for="q" data-t="qLabel"></label>
      <input id="q" type="search" data-tp="qPh" autocomplete="off" spellcheck="false">
      <label class="sr-only" for="contSel" data-t="contLabel"></label>
      <select id="contSel"></select>
      <label class="sr-only" for="tierSel" data-t="tierLabel"></label>
      <select id="tierSel"></select>
      <span class="count" id="tCount" aria-live="polite"></span>
    </div>
    <div class="tbl-wrap">
      <table id="tbl">
        <caption class="sr-only" data-t="tCaption"></caption>
        <thead><tr id="tHead"></tr></thead>
        <tbody id="tBody"></tbody>
      </table>
    </div>
  </section>

  <section class="block method" id="method" aria-labelledby="dTitle">
    <div class="block-h">
      <span class="idx" aria-hidden="true">05</span>
      <h2 id="dTitle" data-t="dTitle"></h2>
    </div>

    <h3 data-t="mhSrc"></h3>
    <p data-th="mpSrc1Html"></p>
    <p data-th="mpSrc2Html"></p>
    <p data-th="mpSrc3Html"></p>

    <h3 data-t="mhTier"></h3>
    <p id="tierRules"></p>
    <ul class="rules" id="tierList"></ul>

    <h3 data-t="mhDraw"></h3>
    <p data-t="mpDraw"></p>

    <h3 data-t="mhRank"></h3>
    <p data-t="mpRank"></p>

    <h3 data-t="mhLimits"></h3>
    <p data-t="mpLimits"></p>

    <h3 data-t="mhFlags"></h3>
    <p data-th="mpFlagsHtml"></p>

    <p class="colophon" data-t="colophon"></p>
  </section>
</main>
<p class="sr-only" aria-live="polite" id="sr"></p>
