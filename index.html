function topoFeatures(topo, obj) {
const t = topo.transform;
const arcs = topo.arcs.map(a => {

});
const ring = ids => {
const pts = [];
for (const i of ids) {
const a = i < 0 ? arcs[~i].slice().reverse() : arcs[i];
if (pts.length) pts.pop();
for (const p of a) pts.push(p.slice());
}
while (pts.length < 4) pts.push(pts[0]);
return pts;
};
const poly = rs => rs.map(ring);

mpSrc1Html: '<b>출생아, 인구, 성비, 기대수명, 합계출산율</b>은 국제연합(UN)의 『세계인구전망 2024(World Population Prospects 2024)』 중위 추계에서 2026년 값을 가져왔습니다. 인구는 한 해의 가운데인 7월 1일 기준이며, 세계 합계는 83억 67만 8,396명으로 UN 공식 값과 같습니다. 출생아는 2026년 한 해 동안 태어날 1억 3,250만 3,469명입니다. 중위연령은 UN과 같은 방식으로 한 살 단위 누적 분포를 보간해 구했습니다.',
mpSrc2Html: '<b>1인당 GDP</b>는 국제통화기금(IMF) 세계경제전망(2026년 4월)의 2025년 추정치를 두 가지로 적었습니다. 큰 숫자는 시장 환율로 바꾼 미국 달러(명목)이고, 순위도 이 값으로 매깁니다. 작은 숫자는 나라 사이 물가 차이를 걷어 낸 구매력평가(PPP) 기준 국제달러입니다. 두 값은 같은 경제를 다른 자로 잰 것이라 차이가 큽니다. 한국은 환율 기준 36,227달러, 구매력 기준 65,405국제달러이고, 인도는 2,675달러와 11,789국제달러입니다. Worldometers가 정리한 IMF 표에서 옮겼고, IMF 값이 없는 곳은 세계은행이나 UN의 다른 해 값을 쓰고 화면과 표에 그 사실을 적었습니다. 환율 기준으로 레위니옹, 코소보, 저지섬처럼 값이 없는 18곳은 비워 두었습니다.',
mpSrc3Html: '<b>지도</b>는 Natural Earth의 1:5천만 경계를 단순화한 것입니다. UN 통계 단위와 맞추려고 프랑스령 기아나, 과들루프, 마르티니크, 레위니옹, 마요트와 카리브 네덜란드를 본국 윤곽에서 떼어 냈습니다. 지브롤터, 토켈라우, 투발루처럼 윤곽이 남지 않을 만큼 작은 곳은 점으로 표시합니다.',

mpSrc1Html: '<b>Births, population, sex ratio at birth, life expectancy and total fertility</b> are the 2026 values from the medium scenario of the United Nations <i>World Population Prospects 2024</i>. Population is as of July 1, the middle of the year; the world total of 8,300,678,396 matches the official UN figure. Births are the 132,503,469 babies to be born during 2026. Median age is interpolated from the cumulative distribution by single year of age, the way the UN does it.',
mpSrc2Html: '<b>GDP per head</b> is the 2025 estimate from the International Monetary Fund (IMF) World Economic Outlook of April 2026, shown two ways. The large number is in US dollars at market exchange rates (nominal), and ranks use this value. The small number is in international dollars at purchasing power parity (PPP), which removes price differences between countries. The two measure the same economy with different rulers, so they can be far apart: South Korea has $36,227 at market rates and Int$65,405 at PPP, India $2,675 and Int$11,789. The figures come from the IMF table compiled by Worldometers; where the IMF has no value, a World Bank or UN value for another year is used and noted on screen and in the table. The 18 places with no market-rate value, such as Réunion, Kosovo and Jersey, are left blank.',
mpSrc3Html: 'The <b>map</b> simplifies the Natural Earth 1:50m boundaries. To match UN statistical units, French Guiana, Guadeloupe, Martinique, Réunion, Mayotte and the Caribbean Netherlands are cut out of their home countries’ outlines. Places too small to keep an outline, such as Gibraltar, Tokelau and Tuvalu, are shown as dots.',
mhTier: 'How development tiers are set',
mhDraw: 'How the draw works',
mpDraw: 'Random numbers are 53 bits from the browser’s cryptographic random number generator (crypto.getRandomValues). A country is picked in proportion to its 2026 births, then the sex is set by that country’s sex ratio at birth. With a ratio of 1.06, the chance of a boy is 1.06 ÷ 2.06, about 51.5%.',
mhRank: 'How to read the ranks',
mpRank: 'Ranks count babies, not countries. “Top 3%” on a record means that of the babies of the same sex born in 2026, about 3% are born in a country that does better on that measure. Babies born in the same country count as half. When you pick a country on the map or in the table, it is compared with all babies born in 2026, boys and girls together.',
mhLimits: 'What the numbers don’t tell you',
mpLimits: 'A national average hides the gaps inside a country. Even within one country, the starting line differs widely by region and income, and between city and countryside. All 2026 values are projections, so wars or disasters since the projection was made may not be reflected. GDP per head, at market rates or at PPP, gives only a rough picture of average output and says nothing about how it is shared. A development tier is an administrative label from international organizations; it says nothing about the life of any one person born in that country.',

'<div class="stack" role="img" aria-label="' + esc(S.batchAria(order.map(ci => S.batchItem(contName(ci), cc[ci], fmtSmall(exp[ci]))).join('; '))) + '">' +
'<div class="stack-row"><span>' + esc(S.rowNow) + '</span><span class="stack-bar">' + seg(cc) + '</span></div>' +
'<div class="stack-row"><span>' + esc(S.rowExp) + '</span><span class="stack-bar exp">' + seg(exp) + '</span></div>' +
'</div>' +
'<ul class="stack-keys">' + order.map(ci => '<li class="k' + ci + '"><i></i>' + esc(contName(ci)) + ' <b>' + cc[ci] + '</b><small>' + esc(S.exp(fmtSmall(exp[ci]))) + '</small></li>').join('') + '</ul>' +
'<p class="batch-top">' + esc(S.mostFrequent + tops.map(([c, k]) => S.topItem(nm(BY.get(c)), fmtInt(k), fmtSmall(BY.get(c).births / tot * n))).join(S.comma) + S.period) + '</p>';
box.hidden = false;
const line = $('#batchLine');
line.innerHTML = S.batchLineHtml(n, TIERS.map((t, i) => '<span class="t-' + t + '">' + S.tier[t] + ' <b>' + tierN[i] + '</b></span>').join(S.comma),
TIERS.map(t => fx(T.share[t] * n, 1)).join(' / ')) +
'<a href="#atlas" id="toMap">' + esc(S.toMap) + '</a>';
line.hidden = false;
}
function hideBatch() {
$('#batch').hidden = true;
$('#batchLine').hidden = true;
if (MAP.ready) MAP.clearBatch();
}
const SPEED = { 1: 1, 10: 1.35, 100: 1.7 };
function doDraws(n) {
const st = store.stats, batch = new Map(), tierN = [0, 0, 0];
let last = null;
for (let k = 0; k < n; k++) {
const r = drawOne();
r.serial = ++store.serial;
const ti = tierIdx(tierOf(r.loc));
st.n++; st.cont[r.loc.cont]++; st.tier[ti]++; tierN[ti]++;
st.top[r.loc.code] = (st.top[r.loc.code] || 0) + 1;
batch.set(r.loc.code, (batch.get(r.loc.code) || 0) + 1);
last = r;
}
const now = Date.now();
last.t = now;
store.recent.unshift({ no: last.serial, c: last.loc.code, s: last.sex, t: now, b: n > 1 ? n : 0 });
store.recent = store.recent.slice(0, 12);
save();
renderStage(last, { animate: true, speed: SPEED[n] || 1 });
if (n === 1) {
hideBatch();
if (MAP.ready) MAP.pick(last.loc.code, true);
} else {
lastBatch = batch;
renderBatch(n, batch, last, tierN);
if (MAP.ready) { MAP.showBatch(batch); MAP.pick(last.loc.code, false); MAP.reset(); }
}
renderMine();
renderHundred();
markTableRow();
const L = last.loc;
announce(n === 1
? S.drawnOne(S.serial(fmtInt(last.serial)), nm(L), sexName(last.sex), fmtPct(L.births / TOT.births), S.tier[tierOf(L)])
: S.drawnMany(n, tierN[0], tierN[1], tierN[2], nm(L)));
}
function reopen(no) {
const r = store.recent.find(x => x.no === no);
if (!r) return;
const st = fromRecent(r);
renderStage(st, { animate: true });
hideBatch();
if (MAP.ready) MAP.pick(st.loc.code, true);
renderHundred();
renderMine();
markTableRow();
announce(S.reopened(S.serial(fmtInt(no)), nm(st.loc), S.tier[tierOf(st.loc)]));
reveal();
}
function lookup(code) {
const L = BY.get(code);
if (!L) return;
renderStage({ type: 'lookup', loc: L }, { animate: true });
hideBatch();
if (MAP.ready) MAP.pick(code, true);
renderHundred();
renderMine();
markTableRow();
announce(S.looked(nm(L), S.tier[tierOf(L)]));
reveal();
}
function pickLang() {
const ok = l => (l && I18N.LANGS.indexOf(l) >= 0 ? l : null);
let l = null;
try { l = ok(new URLSearchParams(location.search).get('lang')); } catch (e) { /* no URLSearchParams */ }
if (!l) { try { l = ok(localStorage.getItem(LANG_KEY)); } catch (e) { /* storage blocked */ } }
return l || 'en';
}
const LANG_FONTS = {
ja: 'https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;600&display=swap',
ru: 'https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Jura:wght@400;500;600&display=swap'
};
const fontsAdded = {};
function applyLang(l) {
LANG = l; S = I18N[l];
document.documentElement.lang = l;
if (LANG_FONTS[l] && !fontsAdded[l]) {
fontsAdded[l] = true;
const k = document.createElement('link');
k.rel = 'stylesheet'; k.href = LANG_FONTS[l];
document.head.appendChild(k);
}
const md = $('meta[name="description"]');
if (md) md.setAttribute('content', S.metaDesc);
document.querySelectorAll('[data-t]').forEach(el => { el.textContent = S[el.dataset.t]; });
document.querySelectorAll('[data-th]').forEach(el => { el.innerHTML = S[el.dataset.th]; });
document.querySelectorAll('[data-tp]').forEach(el => { el.setAttribute('placeholder', S[el.dataset.tp]); });
const track = $('#langTrack');
track.style.setProperty('--n', I18N.LANGS.length);
track.style.setProperty('--i', I18N.LANGS.indexOf(l));
track.querySelectorAll('input').forEach(r => { r.checked = r.value === l; });
$('#tTitle').textContent = S.tTitle(LOCS.length);
$('#draw10').setAttribute('aria-label', S.draw10);
$('#draw100').setAttribute('aria-label', S.draw100);
$('#contSel').innerHTML = '<option value="-1">' + esc(S.allCont) + '</option>' + CONT.map((c, i) => '<option value="' + i + '">' + esc(contName(i)) + '</option>').join('');
$('#contSel').value = String(TBL.cont);
$('#tierSel').innerHTML = '<option value="">' + esc(S.allTier) + '</option>' + TIERS.map(t => '<option value="' + t + '">' + S.tier[t] + '</option>').join('');
$('#tierSel').value = TBL.tier;
const msg = $('#mapMsg');
if (!msg.hidden) msg.textContent = S.mapFail;
clearArmed = 0;
}
function setLang(l) {
if (l === LANG || !I18N[l]) return;
applyLang(l);
try { localStorage.setItem(LANG_KEY, l); } catch (e) { /* choice not kept */ }
try {
const u = new URL(location.href);
if (u.searchParams.has('lang')) { u.searchParams.set('lang', l); history.replaceState(history.state, '', u.href); }
} catch (e) { /* address left as it is */ }
renderIntro(); tickLive(); renderMethod();
renderStage(current, {});
renderHundred(); renderMine();
renderTableHead(); renderTable();
if (lastBatchArgs && !$('#batch').hidden) renderBatch(...lastBatchArgs);
$('#tip').hidden = true;
$('#sr').textContent = '';
requestAnimationFrame(() => { if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitName); });
}
$('#langTrack').addEventListener('change', e => { if (e.target.name === 'lang') setLang(e.target.value); });
$('#draw1').addEventListener('click', () => doDraws(1));
$('#draw10').addEventListener('click', () => doDraws(10));
$('#draw100').addEventListener('click', () => doDraws(100));
$('#copyBtn').addEventListener('click', onCopy);
$('#batchLine').addEventListener('click', e => { if (e.target.closest('#toMap')) { e.preventDefault(); smoothTo($('#atlas')); } });
$('#mRecent').addEventListener('click', e => { const b = e.target.closest('button[data-no]'); if (b) reopen(+b.dataset.no); });
$('#tBody').addEventListener('click', e => { const b = e.target.closest('button[data-code]'); if (b) lookup(+b.dataset.code); });
$('#tHead').addEventListener('click', e => {
const b = e.target.closest('button[data-key]');
if (!b) return;
const k = b.dataset.key;
if (TBL.key === k) TBL.dir = -TBL.dir;
else { TBL.key = k; TBL.dir = k === 'name' || k === 'tier' ? 1 : -1; }
renderTableHead(); renderTable();
const nb = $('#tHead button[data-key="' + k + '"]'); if (nb) nb.focus();
});
$('#q').addEventListener('input', e => { TBL.q = e.target.value.trim(); renderTable(); });
$('#contSel').addEventListener('change', e => { TBL.cont = +e.target.value; renderTable(); });
$('#tierSel').addEventListener('change', e => { TBL.tier = e.target.value; renderTable(); });
$('#clearBtn').addEventListener('click', e => {
const btn = e.currentTarget;
if (Date.now() - clearArmed > 3500) {
clearArmed = Date.now();
btn.textContent = S.clearArm;
announce(S.clearArmSay);
setTimeout(() => { if (Date.now() - clearArmed >= 3400) btn.textContent = S.clear; }, 3500);
return;
}
clearArmed = 0;
btn.textContent = S.clear;
store.serial = 0; store.recent = []; store.stats = freshStats();
save();
if (current.type === 'draw') {
renderStage({ type: 'empty' }, {});
if (MAP.ready) MAP.unpick();
}
hideBatch();
renderMine(); renderHundred(); markTableRow();
announce(S.cleared);
});
$('#idName').setAttribute('tabindex', '-1');
applyLang(pickLang());
tierStats();
paintSpace();
renderIntro();
renderMethod();
renderStage(store.recent.length ? fromRecent(store.recent[0]) : { type: 'empty' }, {});
if (current.type !== 'empty') PLANET.show(current, { animate: true, fresh: true });
renderHundred();
renderMine();
renderTableHead();
renderTable();
tickLive();
setInterval(tickLive, 1000);
let fitT = 0;
window.addEventListener('resize', () => { clearTimeout(fitT); fitT = setTimeout(fitName, 120); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitName);
if (window.d3) initMap();
else loadScript('https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js')
.catch(() => loadScript('https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js'))
.then(initMap, mapFail);
})();
</script>
